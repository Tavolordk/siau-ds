<div class="siau-shell">
  <siau-shell-header [userInitials]="userInitials()" (settingsClick)="onSettingsClick()"
    (logoutClick)="onLogoutClick()" />

  <div class="siau-shell__body">
    <siau-shell-sidebar [items]="navItems" [activeId]="activeItemId()" [collapsed]="sidebarCollapsed()"
      (itemClick)="onItemClick($event)" (collapseToggle)="onCollapseToggle()" />

    <main class="siau-shell__content" role="main">
      <router-outlet />
    </main>
  </div>
</div>
