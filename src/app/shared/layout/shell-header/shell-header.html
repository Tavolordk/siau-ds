<header class="siau-shell-header" role="banner">
    <div class="siau-shell-header__brand">
        <img src="logotipo-institucional-blanco.png" alt="Logo SSPC" class="siau-shell-header__brand-logo" />
    </div>

    <div class="siau-shell-header__title-wrap">
        <h1 class="siau-shell-header__title">{{ title() }}</h1>
    </div>

    <div class="siau-shell-header__actions">
        <button type="button" class="siau-shell-header__avatar" aria-label="Menú de usuario" title="Cerrar sesión"
            (click)="onAvatarClick()">
            @if (userInitials(); as initials) {
            <span class="siau-shell-header__avatar-initials">{{ initials }}</span>
            } @else {
            <siau-lucide-icon name="user" size="24" strokeWidth="2" aria-hidden="true" />
            }
        </button>
    </div>
</header>
