<label class="siau-select">
  <span class="siau-select__label">
    {{ label() }}

    @if (required()) {
      <strong>*</strong>
    }
  </span>

  <select
    class="siau-select__control"
    [value]="value()"
    [required]="required()"
    [disabled]="disabled()"
    (change)="handleChange($event)"
  >
    <option value="" disabled [selected]="!hasSelectedOption()">{{ placeholder() }}</option>

    @for (option of options(); track option.value) {
      <option [value]="option.value" [selected]="option.value === value()">{{ option.label }}</option>
    }
  </select>

  @if (hint()) {
    <span class="siau-select__hint">{{ hint() }}</span>
  }
</label>
