@if (open()) {
<div class="siau-modal" role="dialog" aria-modal="true">
  <div [class]="surfaceClasses()">
    <header class="siau-modal__header">
      <div class="siau-modal__icon-wrap" aria-hidden="true">
        <siau-lucide-icon [name]="icon()" size="18" strokeWidth="2" />
      </div>

      <div class="siau-modal__heading">
        <h2 class="siau-modal__title">{{ title() }}</h2>

        @if (subtitle()) {
        <p class="siau-modal__subtitle">{{ subtitle() }}</p>
        }
      </div>

      @if (headerBadge(); as badge) {
      <span class="siau-modal__badge">{{ badge }}</span>
      }

      <button type="button" class="siau-modal__close" aria-label="Cerrar modal" (click)="closeModal()">
        <siau-lucide-icon name="x" size="18" strokeWidth="2" aria-hidden="true" />
      </button>
    </header>

    <div class="siau-modal__content">
      <ng-content />
    </div>
  </div>
</div>
}
