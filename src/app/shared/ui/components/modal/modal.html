@if (open()) {
  <div class="siau-modal" role="dialog" aria-modal="true" (click)="closeModal()">
    <section
      class="siau-modal__surface"
      [class]="'siau-modal__surface siau-modal__surface--' + size()"
      (click)="stopPropagation($event)"
    >
      <header class="siau-modal__header">
        @if (icon()) {
          <span class="siau-modal__icon-wrap">
            <mat-icon class="siau-modal__icon" aria-hidden="true">{{ icon() }}</mat-icon>
          </span>
        }

        <div class="siau-modal__heading">
          <h2 class="siau-modal__title">{{ title() }}</h2>

          @if (subtitle()) {
            <p class="siau-modal__subtitle">{{ subtitle() }}</p>
          }
        </div>

        @if (headerBadge()) {
          <span class="siau-modal__badge">{{ headerBadge() }}</span>
        }

        <button
          type="button"
          class="siau-modal__close"
          aria-label="Cerrar modal"
          (click)="closeModal()"
        >
          <mat-icon aria-hidden="true">close</mat-icon>
        </button>
      </header>

      <div class="siau-modal__content">
        <ng-content />
      </div>
    </section>
  </div>
}
