<button
  class="siau-button"
  [class]="'siau-button siau-button--' + variant()"
  [type]="type()"
  [disabled]="disabled()"
  (click)="handleClick()"
>
  @if (icon()) {
    <mat-icon class="siau-button__icon" aria-hidden="true">{{ icon() }}</mat-icon>
  }

  <span class="siau-button__label">{{ label() }}</span>

  @if (trailingIcon()) {
    <mat-icon class="siau-button__icon" aria-hidden="true">{{ trailingIcon() }}</mat-icon>
  }
</button>
