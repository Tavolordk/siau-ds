<section class="relative min-h-screen overflow-hidden bg-[#050818] text-white" aria-labelledby="login-title">
    <siau-animated-auth-background />

    <main class="relative z-10 flex min-h-screen flex-col items-center justify-center p-4 pb-20 sm:pb-4">
        <header class="z-10 mb-6 flex w-full max-w-md flex-col items-center text-center sm:mb-8">
            <div class="mb-4 flex items-center justify-center sm:mb-5">
                <img src="sspc.png" alt="Logotipo Institucional"
                    class="h-16 w-auto object-contain drop-shadow-[0_0_18px_rgba(255,255,255,0.25)] sm:h-24" />
            </div>

            <h1 id="login-title" class="text-2xl font-bold leading-tight text-white drop-shadow-md sm:text-3xl">
                Sistema Integral de<br />
                Administración de Usuarios
            </h1>
        </header>

        <div class="relative z-10 w-full max-w-md">
            <form
                class="relative min-h-[480px] overflow-hidden rounded-[2rem] border border-white/30 bg-white/15 p-5 shadow-[0_8px_32px_rgba(0,0,0,0.4)] backdrop-blur-2xl sm:min-h-[520px] sm:p-8"
                [formGroup]="form" (ngSubmit)="submit()" novalidate>
                <div
                    class="pointer-events-none absolute inset-0 rounded-[2rem] border border-white/40 [mask-image:linear-gradient(to_bottom,white,transparent)]">
                </div>

                <div class="relative z-10">
                    <div class="mb-6 text-center">
                        <p class="text-xl font-bold text-white">Bienvenido</p>
                        <p class="mt-1 text-sm text-white/60">Por favor, ingresa tus credenciales</p>
                    </div>

                    <div class="space-y-4">
                        <div class="space-y-3">
                            <label class="group relative block" for="username">
                                <div
                                    class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-4 text-[#E7F1F3]">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                        stroke-linejoin="round">
                                        <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
                                        <circle cx="12" cy="7" r="4"></circle>
                                    </svg>
                                </div>

                                <input id="username" type="text" formControlName="username" placeholder="Usuario"
                                    autocomplete="username"
                                    class="w-full rounded-xl border border-white/30 bg-[#99A8BE] py-3 pl-11 pr-4 text-[#1B1F4A] shadow-inner transition-all placeholder:text-[#E7F1F3] focus:outline-none focus:ring-2 focus:ring-white/50 disabled:opacity-60" />
                            </label>

                            <label class="group relative block" for="password">
                                <div
                                    class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-4 text-[#E7F1F3]">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                        stroke-linejoin="round">
                                        <rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect>
                                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                                    </svg>
                                </div>

                                <input id="password" type="password" formControlName="password" placeholder="Contraseña"
                                    autocomplete="current-password"
                                    class="w-full rounded-xl border border-white/30 bg-[#99A8BE] py-3 pl-11 pr-4 text-[#1B1F4A] shadow-inner transition-all placeholder:text-[#E7F1F3] focus:outline-none focus:ring-2 focus:ring-white/50 disabled:opacity-60" />
                            </label>
                        </div>

                        <section class="overflow-hidden rounded-xl border border-white/30 bg-[#99A8BE]/35">
                            <div class="flex items-center justify-between px-3 pb-1 pt-2.5">
                                <span class="text-xs font-semibold uppercase tracking-wide text-white/80">
                                    Verificación de Seguridad
                                </span>

                                <button type="button"
                                    class="rounded p-0.5 text-white/60 transition-colors hover:text-white"
                                    aria-label="Actualizar captcha">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24"
                                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                        stroke-linejoin="round">
                                        <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path>
                                        <path d="M21 3v5h-5"></path>
                                        <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"></path>
                                        <path d="M8 16H3v5"></path>
                                    </svg>
                                </button>
                            </div>

                            <div
                                class="mx-3 mb-2 overflow-hidden rounded-lg border border-white/20 bg-[linear-gradient(135deg,#DDE5EF_0%,#C5D3E2_50%,#D8E2EE_100%)]">
                                <div class="relative flex select-none items-center justify-center gap-0.5 px-2 py-1">
                                    <svg class="pointer-events-none absolute inset-0 h-full w-full opacity-[0.18]"
                                        xmlns="http://www.w3.org/2000/svg">
                                        <line x1="0" y1="40%" x2="100%" y2="55%" stroke="#1B1F4A" stroke-width="1.5">
                                        </line>
                                        <line x1="0" y1="65%" x2="100%" y2="35%" stroke="#1E5B4F" stroke-width="1">
                                        </line>
                                        <line x1="10%" y1="0" x2="80%" y2="100%" stroke="#1B1F4A" stroke-width="0.8">
                                        </line>
                                    </svg>

                                    <span
                                        class="inline-block rotate-[-8deg] translate-y-[-1px] font-['Noto_Sans'] text-[1.15rem] font-bold tracking-[0.05em] text-[#1B1F4A] [text-shadow:0_1px_2px_rgba(0,0,0,0.15)]">V</span>
                                    <span
                                        class="inline-block rotate-[5deg] translate-y-[2px] font-['Noto_Sans'] text-[1.05rem] font-black tracking-[0.05em] text-[#1E5B4F] [text-shadow:0_1px_2px_rgba(0,0,0,0.15)]">T</span>
                                    <span
                                        class="inline-block rotate-[-4deg] translate-y-[-1px] font-['Noto_Sans'] text-[1.2rem] font-semibold tracking-[0.05em] text-[#2C3A8C] [text-shadow:0_1px_2px_rgba(0,0,0,0.15)]">8</span>
                                    <span
                                        class="inline-block rotate-[7deg] translate-y-[2px] font-['Noto_Sans'] text-[1rem] font-extrabold tracking-[0.05em] text-[#14453D] [text-shadow:0_1px_2px_rgba(0,0,0,0.15)]">K</span>
                                    <span
                                        class="inline-block rotate-[-6deg] translate-y-[-1px] font-['Noto_Sans'] text-[1.18rem] font-bold tracking-[0.05em] text-[#334180] [text-shadow:0_1px_2px_rgba(0,0,0,0.15)]">K</span>
                                    <span
                                        class="inline-block rotate-[3deg] translate-y-[2px] font-['Noto_Sans'] text-[1.08rem] font-black tracking-[0.05em] text-[#1B1F4A] [text-shadow:0_1px_2px_rgba(0,0,0,0.15)]">5</span>
                                </div>
                            </div>

                            <div class="px-3 pb-3">
                                <input type="text" formControlName="captcha"
                                    placeholder="Escribe los caracteres de arriba" maxlength="6" autocomplete="off"
                                    (input)="normalizeCaptcha()"
                                    class="w-full rounded-lg border border-white/30 bg-[#99A8BE] px-3 py-2 text-sm font-semibold uppercase tracking-widest text-[#1B1F4A] shadow-inner transition-all placeholder:font-normal placeholder:normal-case placeholder:tracking-normal placeholder:text-[#E7F1F3] focus:outline-none focus:ring-2 focus:ring-white/50 disabled:opacity-60" />
                            </div>
                        </section>

                        @if (auth.error()) {
                        <p class="rounded-xl border border-red-200/30 bg-red-500/15 px-3 py-2 text-sm text-red-50"
                            role="alert">
                            {{ auth.error() }}
                        </p>
                        }

                        <button type="submit" [disabled]="form.invalid || auth.loading()"
                            class="group mt-1 flex w-full items-center justify-center gap-2 rounded-xl bg-[#1B1F4A] py-3.5 font-bold text-white shadow-[0_4px_12px_rgba(0,0,0,0.3)] transition-all hover:brightness-110 disabled:cursor-not-allowed disabled:opacity-70">
                            {{ auth.loading() ? 'Validando...' : 'Ingresar' }}
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" class="transition-transform group-hover:translate-x-1">
                                <path d="m9 18 6-6-6-6"></path>
                            </svg>
                        </button>
                    </div>

                    <div class="mt-5 border-t border-white/20 pt-4 text-center">
                        <p class="mb-3 text-sm text-white/80">¿No tienes una cuenta?</p>

                        <a routerLink="/login"
                            class="flex w-full items-center justify-center gap-2 rounded-xl border border-white/20 bg-[#D8D8D8] py-3 font-semibold text-[#1B1F4A] shadow-md transition-all hover:brightness-95">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round">
                                <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
                                <circle cx="9" cy="7" r="4"></circle>
                                <line x1="19" x2="19" y1="8" y2="14"></line>
                                <line x1="22" x2="16" y1="11" y2="11"></line>
                            </svg>
                            Crear cuenta
                        </a>
                    </div>
                </div>
            </form>
        </div>
    </main>

    <footer
        class="pointer-events-none fixed bottom-4 left-0 right-0 z-20 flex items-end justify-between px-4 sm:bottom-6 sm:px-8">
        <div class="text-xs font-medium text-white/50 drop-shadow-md sm:text-sm">
            Desarrollado por <span class="text-white/80">UIIVT <span class="font-normal">|</span> DGSI</span>
        </div>

        <div
            class="rounded-lg border border-white/10 bg-black/20 px-2.5 py-1 text-xs font-medium text-white/40 backdrop-blur-sm sm:px-3 sm:py-1.5">
            Versión 1.0.0
        </div>
    </footer>
</section>
