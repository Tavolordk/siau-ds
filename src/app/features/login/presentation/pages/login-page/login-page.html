<section class="auth-screen" aria-labelledby="login-title">
    <div class="auth-screen__background" aria-hidden="true">
        <div class="auth-screen__radial"></div>
        <div class="auth-screen__orb auth-screen__orb--primary"></div>
        <div class="auth-screen__orb auth-screen__orb--secondary"></div>
        <img class="auth-screen__canvas"
            src="https://api.builder.io/api/v1/image/assets/TEMP/603a17edbb43c681b325164961704c69f3182fe1?width=3824"
            alt="" />
    </div>

    <main class="auth-screen__content">
        <header class="auth-brand">
            <img class="auth-brand__logo"
                src="https://api.builder.io/api/v1/image/assets/TEMP/bb1fc7b700166f0f5868cba1034abd0603389345?width=896"
                alt="Logotipo Institucional" />
            <h1 id="login-title" class="auth-brand__title">
                Sistema Integral de<br />Administración de Usuarios
            </h1>
        </header>

        <form class="auth-card" [formGroup]="form" (ngSubmit)="submit()" novalidate>
            <div class="auth-card__intro">
                <h2>Bienvenido</h2>
                <p>Por favor, ingresa tus credenciales</p>
            </div>

            <div class="auth-form">
                <label class="auth-field" for="username">
                    <span class="auth-field__icon" aria-hidden="true">
                        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path
                                d="M14.25 15.75V14.25C14.25 13.4544 13.9339 12.6913 13.3713 12.1287C12.8087 11.5661 12.0456 11.25 11.25 11.25H6.75C5.95435 11.25 5.19129 11.5661 4.62868 12.1287C4.06607 12.6913 3.75 13.4544 3.75 14.25V15.75"
                                stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                                stroke-linejoin="round" />
                            <path
                                d="M9 8.25C10.6569 8.25 12 6.90685 12 5.25C12 3.59315 10.6569 2.25 9 2.25C7.34315 2.25 6 3.59315 6 5.25C6 6.90685 7.34315 8.25 9 8.25Z"
                                stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                                stroke-linejoin="round" />
                        </svg>
                    </span>
                    <input id="username" type="text" formControlName="username" placeholder="Usuario"
                        autocomplete="username" />
                </label>

                <label class="auth-field" for="password">
                    <span class="auth-field__icon" aria-hidden="true">
                        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path
                                d="M14.25 8.25H3.75C2.92157 8.25 2.25 8.92157 2.25 9.75V15C2.25 15.8284 2.92157 16.5 3.75 16.5H14.25C15.0784 16.5 15.75 15.8284 15.75 15V9.75C15.75 8.92157 15.0784 8.25 14.25 8.25Z"
                                stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                                stroke-linejoin="round" />
                            <path
                                d="M5.25 8.25V5.25C5.25 4.25544 5.64509 3.30161 6.34835 2.59835C7.05161 1.89509 8.00544 1.5 9 1.5C9.99456 1.5 10.9484 1.89509 11.6517 2.59835C12.3549 3.30161 12.75 4.25544 12.75 5.25V8.25"
                                stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                                stroke-linejoin="round" />
                        </svg>
                    </span>
                    <input id="password" type="password" formControlName="password" placeholder="Contraseña"
                        autocomplete="current-password" />
                </label>

                <section class="captcha" aria-labelledby="captcha-title">
                    <div class="captcha__header">
                        <h3 id="captcha-title">Verificación de Seguridad</h3>
                        <button class="captcha__refresh" type="button" aria-label="Actualizar captcha">
                            <svg width="13" height="13" viewBox="0 0 13 13" fill="none"
                                xmlns="http://www.w3.org/2000/svg">
                                <path
                                    d="M1.625 6.5C1.625 5.20707 2.13861 3.96709 3.05285 3.05285C3.96709 2.13861 5.20707 1.625 6.5 1.625C7.86286 1.63013 9.17098 2.16191 10.1508 3.10917L11.375 4.33333"
                                    stroke="currentColor" stroke-opacity="0.6" stroke-width="1.08333"
                                    stroke-linecap="round" stroke-linejoin="round" />
                                <path d="M11.375 1.625V4.33333H8.66663" stroke="currentColor" stroke-opacity="0.6"
                                    stroke-width="1.08333" stroke-linecap="round" stroke-linejoin="round" />
                                <path
                                    d="M11.375 6.5C11.375 7.79293 10.8614 9.03291 9.94715 9.94715C9.03291 10.8614 7.79293 11.375 6.5 11.375C5.13714 11.3699 3.82903 10.8381 2.84917 9.89083L1.625 8.66667"
                                    stroke="currentColor" stroke-opacity="0.6" stroke-width="1.08333"
                                    stroke-linecap="round" stroke-linejoin="round" />
                                <path d="M4.33333 8.66669H1.625V11.375" stroke="currentColor" stroke-opacity="0.6"
                                    stroke-width="1.08333" stroke-linecap="round" stroke-linejoin="round" />
                            </svg>
                        </button>
                    </div>

                    <div class="captcha__display" aria-label="Código captcha P Z E J 5 N">
                        <span class="captcha__noise"></span>
                        <span class="captcha__letter captcha__letter--one">P</span>
                        <span class="captcha__letter captcha__letter--two">Z</span>
                        <span class="captcha__letter captcha__letter--three">E</span>
                        <span class="captcha__letter captcha__letter--four">J</span>
                        <span class="captcha__letter captcha__letter--five">5</span>
                        <span class="captcha__letter captcha__letter--six">N</span>
                    </div>

                    <label class="captcha__input" for="captcha">
                        <input id="captcha" type="text" formControlName="captcha"
                            placeholder="Escribe los caracteres de arriba" maxlength="6" autocomplete="off"
                            (input)="normalizeCaptcha()" />
                    </label>
                </section>

                @if (auth.error()) {
                <p class="auth-error" role="alert">{{ auth.error() }}</p>
                }

                <button class="auth-submit" type="submit" [disabled]="form.invalid || auth.loading()">
                    <span>{{ auth.loading() ? 'Validando...' : 'Ingresar' }}</span>
                    <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg"
                        aria-hidden="true">
                        <path d="M6.75 13.5L11.25 9L6.75 4.5" stroke="currentColor" stroke-width="1.5"
                            stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                </button>
            </div>

            <div class="auth-card__signup">
                <p>¿No tienes una cuenta?</p>
                <a class="auth-secondary" routerLink="/login">
                    <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg"
                        aria-hidden="true">
                        <path
                            d="M12 15.75V14.25C12 13.4544 11.6839 12.6913 11.1213 12.1287C10.5587 11.5661 9.79565 11.25 9 11.25H4.5C3.70435 11.25 2.94129 11.5661 2.37868 12.1287C1.81607 12.6913 1.5 13.4544 1.5 14.25V15.75"
                            stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                        <path
                            d="M6.75 8.25C8.40685 8.25 9.75 6.90685 9.75 5.25C9.75 3.59315 8.40685 2.25 6.75 2.25C5.09315 2.25 3.75 3.59315 3.75 5.25C3.75 6.90685 5.09315 8.25 6.75 8.25Z"
                            stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                        <path d="M14.25 6V10.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                            stroke-linejoin="round" />
                        <path d="M16.5 8.25H12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                            stroke-linejoin="round" />
                    </svg>
                    <span>Crear cuenta</span>
                </a>
            </div>
        </form>
    </main>

    <footer class="auth-footer">
        <p>Desarrollado por <strong>UIIVT</strong> <span>|</span> <strong>DGSI</strong></p>
        <span class="auth-footer__version">Versión 1.0.0</span>
    </footer>
</section>
