<siau-modal
    [open]="open()"
    [title]="modalTitle()"
    [subtitle]="modalSubtitle()"
    [icon]="modalIcon()"
    size="xl"
    [headerBadge]="headerBadge()"
    (close)="closeWizard()">
    <section class="registration-wizard">
        <app-user-registration-wizard-sidebar />

        <form class="registration-wizard__content">
            <app-user-registration-wizard-feedback />

            @switch (activeStepId()) {
                @case ('personal-data') {
                    <app-user-registration-personal-data-step />
                }
                @case ('assignment') {
                    <app-user-registration-assignment-step />
                }
                @case ('commission') {
                    <app-user-registration-commission-step />
                }
                @case ('documents') {
                    <app-user-registration-documents-step />
                }
                @case ('contact') {
                    <app-user-registration-contact-step />
                }
                @case ('profiles') {
                    <app-user-registration-profiles-step />
                }
                @case ('account') {
                    <app-user-registration-account-step />
                }
            }

            <app-user-registration-wizard-footer (closeRequested)="closeWizard()" />
        </form>
    </section>
</siau-modal>

<app-user-registration-delete-draft-modal />
<app-user-registration-success-modal (confirmed)="closeSaveSuccessModal()" />
