            <section class="registration-wizard__section">
                <div class="registration-wizard__section-header">
                    <span class="registration-wizard__section-icon">
                        <siau-lucide-icon name="user" size="18" strokeWidth="2" aria-hidden="true" />
                    </span>

                    <div class="registration-wizard__section-title">
                        <h3>Datos Personales</h3>
                        <p>Información de identidad oficial del nuevo usuario</p>
                    </div>

                    <div class="registration-wizard__section-meta">
                        <span class="registration-wizard__required-pill">Campos obligatorios</span>
                        <span class="registration-wizard__section-count">
                            {{ activeStepNumber() }} / {{ stepOrder().length }}
                        </span>
                    </div>

                    <div class="registration-wizard__progress-strip" aria-hidden="true">
                        @for (segment of stepProgressSegments(); track segment.id) {
                        <span [class.registration-wizard__progress-segment--active]="segment.active"></span>
                        }
                    </div>
                </div>

                <div class="registration-wizard__grid">
                    <siau-input label="CUIP" placeholder="Ej. GARC910515H094569875" [value]="form().cuip"
                        [maxLength]="20" [alphanumericOnly]="true" hint="Formato: 4 letras, 6 números, H/M y 9 números"
                        (valueChange)="updateForm('cuip', $event)" [disabled]="isFormDisabled()"
                        [error]="fieldError('cuip')" />

                    <div class="registration-wizard__curp-field">
                        <siau-input label="CURP" placeholder="Ej. UPL010923HOCZRSA3" [required]="true" [maxLength]="18"
                            [alphanumericOnly]="true" [value]="form().curp" (valueChange)="updateCurp($event)"
                            [disabled]="isCurpInputDisabled()" [error]="fieldError('curp')" />

                        @if (showCurpUnlock()) {
                        <label class="registration-wizard__curp-unlock">
                            <input type="checkbox" [checked]="curpUnlockChecked()"
                                [disabled]="isFormDisabled() || isSubmitting() || renapoLookupStatus() === 'loading'"
                                (change)="toggleCurpUnlock($any($event.target).checked)" />

                            <span class="registration-wizard__curp-unlock-check" aria-hidden="true">
                                @if (curpUnlockChecked()) {
                                <siau-lucide-icon name="check" size="11" strokeWidth="2.6" aria-hidden="true" />
                                }
                            </span>

                            <span>Desbloquear CURP para consultar otra</span>
                        </label>
                        }
                    </div>

                    <siau-input label="RFC" placeholder="Ej. UPL010923SK0" [required]="rfcRequired()" [maxLength]="13"
                        [alphanumericOnly]="true" [hint]="rfcHint()" [value]="form().rfc"
                        (valueChange)="updateRfc($event)" [disabled]="isFormDisabled()" [error]="fieldError('rfc')" />

                    <siau-input label="Nombre(s)" placeholder="Se llenará automáticamente" [required]="true"
                        [maxLength]="100" [alphabeticOnly]="true" [value]="form().firstName"
                        (valueChange)="updateForm('firstName', $event)" [disabled]="isRenapoPersonalDataDisabled()"
                        [error]="fieldError('firstName')" />

                    <siau-input label="Primer Apellido" placeholder="Se llenará automáticamente" [required]="true"
                        [maxLength]="100" [alphabeticOnly]="true" [value]="form().lastName"
                        (valueChange)="updateForm('lastName', $event)" [disabled]="isRenapoPersonalDataDisabled()"
                        [error]="fieldError('lastName')" />

                    <siau-input label="Segundo Apellido" placeholder="Opcional" [maxLength]="100"
                        [alphabeticOnly]="true" [value]="form().secondLastName"
                        (valueChange)="updateForm('secondLastName', $event)" [disabled]="isRenapoPersonalDataDisabled()"
                        [error]="fieldError('secondLastName')" />

                    <siau-select label="Sexo" placeholder="Seleccione sexo" [required]="true"
                        [options]="genderOptions()" [value]="form().gender" (valueChange)="updateForm('gender', $event)"
                        [disabled]="isFormDisabled()" [error]="fieldError('gender')" />

                    <siau-select label="Estado civil" placeholder="Selecciona el estado civil (opcional)"
                        [options]="civilStatusOptions()" [value]="form().civilStatus"
                        (valueChange)="updateForm('civilStatus', $event)" [disabled]="isFormDisabled()" />

                    <siau-input label="Fecha de Nacimiento" type="date" [required]="true" [min]="minimumBirthDate()"
                        [max]="maximumBirthDate()" [value]="form().birthDate" [clampOnBlur]="true"
                        [error]="fieldError('birthDate')"
                        hint="Fecha permitida: desde 01/01/1900 hasta cumplir 18 años a la fecha actual."
                        (valueChange)="updateForm('birthDate', $event)" [disabled]="isBirthDateInputDisabled()" />
                </div>

            </section>
