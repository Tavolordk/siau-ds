            <section class="registration-wizard__section">
                <div class="registration-wizard__section-header"> <span class="registration-wizard__section-icon">
                        <siau-lucide-icon name="phone" size="18" strokeWidth="2" aria-hidden="true" />
                    </span>

                    <div class="registration-wizard__section-title">
                        <h3>Medio de Contacto</h3>
                        <p>Correo institucional y teléfono de contacto</p>
                    </div>

                    <div class="registration-wizard__section-meta">
                        <span class="registration-wizard__required-pill">Correo y celular obligatorios</span>
                        <span class="registration-wizard__section-count">
                            {{ activeStepNumber() }} / {{ stepOrder().length }}
                        </span>
                    </div>

                    <div class="registration-wizard__progress-strip" aria-hidden="true">
                        @for (segment of stepProgressSegments(); track segment.id) {
                        <span [class.registration-wizard__progress-segment--active]="segment.active"></span>
                        }
                    </div>
                </div>

                <div class="registration-wizard__info-box registration-wizard__info-box--compact">
                    <siau-lucide-icon name="info" size="16" strokeWidth="2" aria-hidden="true" />
                    <span>El <strong>correo electrónico y el teléfono celular son obligatorios</strong>.</span>
                </div>

                <div class="registration-wizard__grid">
                    <siau-input label="Correo Electrónico" type="email" placeholder="usuario@sspc.gob.mx"
                        [required]="emailRequired()" [maxLength]="254" [value]="form().email" [emailOnly]="true"
                        [error]="fieldError('email')" (valueChange)="updateForm('email', $event)"
                        [disabled]="isFormDisabled()" />

                    <siau-input label="Teléfono Celular" placeholder="Ej. 5512345678" [required]="phoneRequired()"
                        [maxLength]="10" [numericOnly]="true" [value]="form().phone" [error]="fieldError('phone')"
                        (valueChange)="updateForm('phone', $event)" [disabled]="isFormDisabled()" />

                </div>
            </section>
