<section class="users-page">
    <app-user-management-page-header />

    <main class="users-page__content">
        <app-user-management-page-actions />

        <article
            class="users-table-card"
            [class.users-table-card--filters-open]="isFilterPanelOpen()"
            [attr.aria-busy]="isLoading() || isDetailLoading()">
            <app-user-management-filter-workspace />
            <app-user-management-users-table />
        </article>
    </main>
</section>

<app-user-registration-wizard
    [open]="isUserWizardOpen()"
    [mode]="userWizardMode()"
    [user]="selectedUser()"
    [userDetail]="selectedUserDetail()"
    [readonlyMode]="selectedUser() !== null && isUserReadOnly(selectedUser()!)"
    [draftToOpen]="draftToOpen()"
    [autoRestoreDraft]="autoRestoreDraft()"
    (saved)="handleUserSaved()"
    (closed)="closeUserWizard()" />

<app-user-management-drafts-modal />
<app-user-management-baja-user-modal />
<app-user-management-status-user-modal />
<app-user-management-operation-success-modal />
